name: Post queue to Instagram

# Postet faellige Items aus quantcode/content_queue.json - ganz ohne Claude-Session.
# Einmalig einrichten: GitHub -> Settings -> Secrets and variables -> Actions
#   Secrets:  IG_ACCESS_TOKEN, IG_BUSINESS_ACCOUNT_ID
#   (optional) Variable: PUBLIC_BASE_URL (sonst GitHub-Pages-Adresse dieses Repos)

on:
  schedule:
    # UTC. Fuenf Slots am Tag: Morgen-Stories, Feed-Post, Mittag, Nachmittag, Abend-Update
    - cron: "20 7 * * *"
    - cron: "50 9 * * *"
    - cron: "10 12 * * *"
    - cron: "20 15 * * *"
    - cron: "25 18 * * *"
  workflow_dispatch:
    inputs:
      max_items:
        description: "Maximal so viele Items in diesem Lauf"
        default: "8"
      dry_run:
        description: "Nur anzeigen, nichts posten (true/false)"
        default: "false"

concurrency:
  group: post-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten
        run: pip install requests

      - name: Faellige Items posten
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          MAX_ITEMS: ${{ github.event.inputs.max_items || '8' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python quantcode/social/queue_runner.py --dry-run --max "$MAX_ITEMS"
          else
            python quantcode/social/queue_runner.py --max "$MAX_ITEMS" --max-feed 1
          fi

      - name: Queue-Stand zurueckschreiben
        if: always()
        run: |
          git config user.name "quantcode-bot"
          git config user.email "quantcode-bot@users.noreply.github.com"
          git add quantcode/content_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Queue: Posting-Status aktualisiert (Action)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
